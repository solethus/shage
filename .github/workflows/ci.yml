name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
      # Cheap, and it rides along here rather than claiming a runner of its own: the
      # workspace is already built by the line above.
      - run: cargo xtask seams --check

  # shage: the two lint jobs are pinned, and only they. rustfmt and clippy add rules in
  # every release, so a freshly resolved `stable` turns a branch red with no code change --
  # clippy 1.98 did exactly that to vendored upstream code that this fork must not edit.
  # `check` and `test` stay on stable: those break on real language changes, which is
  # something we want to hear about. Bump both pins together, in the same commit that fixes
  # whatever the newer lint found.
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    needs: [check, fmt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  static-linux:
    name: Static Linux binary
    if: github.event_name == 'pull_request'
    needs: [check, fmt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-musl
      - name: Build static binary
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Verify static binary
        run: |
          binary=target/x86_64-unknown-linux-musl/release/shage
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/shage-core/Cargo.toml | head -1)
          test "$("$binary" --version)" = "tuicr $version"
          if readelf -lW "$binary" | grep -Eq '(^|[[:space:]])INTERP([[:space:]]|$)'; then
            echo "Linux release binary contains a dynamic interpreter" >&2
            readelf -lW "$binary" >&2
            exit 1
          fi

  test:
    name: Test
    needs: [check, fmt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Mercurial (if missing)
        run: command -v hg || (sudo apt-get update && sudo apt-get install -y mercurial)
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main
      - name: Install Jujutsu (if missing)
        run: command -v jj || cargo binstall --strategies crate-meta-data jj-cli --no-confirm
      - run: cargo test --workspace

  oracle:
    name: Differential oracle
    needs: [check, fmt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned, and for a different reason than the lint jobs above: `oracle.baseline` is a
      # measurement of one indexer's answers, so it is only comparable against the version
      # that produced it. A floating rust-analyzer would move the numbers under the floor
      # and read as a regression in our resolver. Bump this pin and re-bless together, never
      # separately.
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rust-analyzer
      - uses: Swatinem/rust-cache@v2
      - run: rust-analyzer --version
      - run: cargo xtask fixtures
      - run: cargo xtask oracle
